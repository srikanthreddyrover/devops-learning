name: My First DevOps CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Linux Environment
        run: |
          echo "Welcome to DevOps CI/CD"
          whoami
          pwd
          ls -la

      - name: Test README File
        run: |
          test -f README.md
          echo "README test passed!"

      - name: Build Simulation
        run: |
          echo "Building application..."
          echo "Build successful!"
